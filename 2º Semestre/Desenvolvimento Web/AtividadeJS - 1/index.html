<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perguntas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form class="g-3 needs-validation" id="perguntas" novalidate>
        <div class="col-12">
            <label for="pergunta1" class="form-label">
                1. Faça um algoritmo que solicite o ano de nascimento de uma pessoa, calcule e mostre quantos anos de
                vida esta pessoa tem.
            </label>

            <input type="text" class="form-control" id="pergunta1" name="pergunta1"
                placeholder="Digite o ano que voce nasceu..." required>

            <div class="col-12 mt-2">
                <button class="btn btn-primary" type="button" id="botao1" onclick="window.pergunta1()">
                    Responder
                </button>
            </div>

            <div id="resposta1" class="mt-2"></div>
        </div>


        <div class="col-12">
            <label for="pergunta2" class="form-label">
                2. Leia o salário de um funcionário, se ele ganhar até um salário mínimo conceda um aumento em seu
                salário de 15%, senão o aumento deve ser de apenas 8%. Ao final mostre o novo salário do funcionário já
                reajustado.
            </label>

            <input type="text" class="form-control" id="pergunta2" name="pergunta2" placeholder="digite seu salario..."
                required>

            <div class="col-12 mt-2">
                <button class="btn btn-primary" type="button" id="botao2" onclick="window.pergunta2()">
                    Responder
                </button>
            </div>

            <div id="resposta2" class="mt-2"></div>
        </div>

        <div class="col-12">
            <label for="pergunta3" class="form-label">
                3. Solicite a idade de uma pessoa, caso ela for menor de idade mostre a seguinte mensagem "Você é menor
                de idade", caso ela for maior de idade mostre "Você é maior de idade".
            </label>

            <input type="text" class="form-control" id="pergunta3" name="pergunta3" placeholder="digite sua idade..."
                required>

            <div class="col-12 mt-2">
                <button class="btn btn-primary" type="button" id="botao3" onclick="window.pergunta3()">
                    Responder
                </button>
            </div>

            <div id="resposta3" class="mt-2"></div>
        </div>

        <div class="col-12">
            <label class="form-label">
                4. Calcule a média aritmética das 3 notas de um aluno.
            </label>

            <input type="number" class="form-control" id="nota1" name="nota1" placeholder="Nota 1" required>

            <input type="number" class="form-control mt-2" id="nota2" name="nota2" placeholder="Nota 2" required>

            <input type="number" class="form-control mt-2" id="nota3" name="nota3" placeholder="Nota 3" required>

            <div class="col-12 mt-2">
                <button class="btn btn-primary" type="button" id="botao4" onclick="pergunta4()">
                    Responder
                </button>
            </div>

            <div id="resposta4" class="mt-2"></div>
        </div>

        <div class="col-12">
            <label class="form-label">
                5. Informe o código do item pedido e a quantidade.
            </label>

            <input type="number" class="form-control" id="codigoItem" name="codigoItem" placeholder="Código do item"
                required>

            <input type="number" class="form-control mt-2" id="quantidade" name="quantidade" placeholder="Quantidade"
                required>

            <div class="col-12 mt-2">
                <button class="btn btn-primary" type="button" id="botao5" onclick="pergunta5()">
                    Responder
                </button>
            </div>

            <div id="resposta5" class="mt-2"></div>

            <table class="Valores mt-3">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Preço unitário</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>100</td>
                        <td>Cachorro quente</td>
                        <td>R$ 5.50</td>
                    </tr>
                    <tr>
                        <td>101</td>
                        <td>Bauru simples</td>
                        <td>R$ 6.00</td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Bauru com ovo</td>
                        <td>R$ 6.50</td>
                    </tr>
                    <tr>
                        <td>103</td>
                        <td>Hamburger</td>
                        <td>R$ 6.75</td>
                    </tr>
                    <tr>
                        <td>104</td>
                        <td>Cheeseburguer</td>
                        <td>R$ 7.50</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9hJ09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="perguntas.js"></script>
</body>

</html>
